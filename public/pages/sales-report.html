<!-- pages/sales-report.html -->
<style>
  .report-container {
    display: flex;
    flex-direction: column;
    gap: 0;
    /* Mobile: natural document flow */
    height: auto;
    overflow: visible;
  }
  .report-top-section {
    flex-shrink: 0;
    margin-bottom: 0;
  }
  .report-table-card {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 320px;
  }

  /* ── Desktop: fixed layout ─────────────────────────────────── */
  @media (min-width: 768px) {
    .report-container {
      height: 100%;
      overflow: hidden;
      display: grid;
      /* Row 1: page header | Row 2: KPI+chart (static) | Row 3: Transactions table (scrollable) */
      grid-template-rows: auto auto minmax(0, 1fr);
      grid-template-columns: 1fr;
      gap: 0;
    }
    /* Header row occupies row 1 */
    .report-header-row { grid-row: 1; }

    /* Static top section: KPI + chart + top products (no scroll) */
    .report-top-section {
      grid-row: 2;
      padding-right: 0.25rem;
      padding-bottom: 0.5rem;
    }

    /* Transactions table always visible at bottom, fills remaining height */
    .report-table-card {
      grid-row: 3;
      margin-top: 1rem;
      min-height: 0;
      flex: unset;
    }
  }


  /* Chart Styles */
  .chart-container-wrapper {
    display: flex;
    height: 8.5rem;
    position: relative;
    margin-bottom: 0.5rem;
  }
  .chart-y-axis {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 8rem;
    font-size: 0.625rem;
    font-weight: 600;
    color: var(--on-surface-variant);
    width: 3.25rem;
    text-align: right;
    padding-right: 0.625rem;
    line-height: 1;
    margin-top: -3px; /* Align with first bar peak */
  }
  .chart-body {
    position: relative;
    flex: 1;
    height: 8rem;
  }
  .chart-gridline {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 1px dashed rgba(196, 198, 207, 0.25);
    z-index: 1;
  }
  .chart-bars-container {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    z-index: 2;
  }
  .chart-bar {
    flex: 1;
    border-radius: 4px 4px 0 0;
    cursor: pointer;
    position: relative;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .chart-bar:hover {
    transform: scaleY(1.05);
    z-index: 10;
  }
  .chart-bar-active {
    background: linear-gradient(180deg, #3b82f6 0%, var(--primary-container) 100%);
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.15);
  }
  .chart-bar-peak {
    background: linear-gradient(180deg, #10b981 0%, #059669 100%) !important;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4) !important;
  }
  .chart-bar-empty {
    background: var(--surface-container-high);
  }
  /* Insights Cards */
  .insight-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 1rem;
    padding-top: 0.875rem;
    border-top: 1px solid rgba(196, 198, 207, 0.15);
  }
  .insight-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--surface-container-low);
    padding: 0.625rem 0.875rem;
    border-radius: var(--radius-md);
    border: 1px solid rgba(196, 198, 207, 0.08);
  }
  .insight-icon {
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    border-radius: var(--radius-sm);
  }
  .insight-info {
    display: flex;
    flex-direction: column;
    gap: 0.125rem;
  }
  .insight-label {
    font-size: 0.625rem;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .insight-val {
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--text-blue);
  }
  .insight-subtext {
    font-size: 0.625rem;
    color: var(--on-surface-variant);
  }

  /* Mobile responsiveness */
  @media (max-width: 767px) {
    .chart-container-wrapper {
      height: 9rem;
    }
    .chart-y-axis {
      width: 2.75rem;
      font-size: 0.55rem;
      padding-right: 0.375rem;
      margin-top: -2px;
    }
    .chart-body {
      height: 8.5rem;
    }
    .insight-card {
      grid-template-columns: 1fr;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .insight-item {
      padding: 0.5rem 0.75rem;
    }
  }
</style>
<div class="fade-in report-container">
  <div class="report-header-row analytics-header-row" style="display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:1.5rem;">
    <div>
      <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.15em;font-weight:700;color:var(--on-surface-variant);">Reports</p>
      <h1 style="font-size:1.875rem;font-weight:800;color:var(--text-blue);">Daily Sales Report</h1>
    </div>
    <div style="display:flex;gap:0.75rem;align-items:center;">
      <input type="date" id="report-date" class="form-input" style="width:11rem;height:2.5rem;margin:0;" onchange="loadReport()" />
      <button class="btn btn-primary btn-sm" id="btn-export-sales" onclick="exportExcel()" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;height:2.5rem;padding:0 1.25rem;font-weight:600;margin:0;">
        <span class="material-symbols-outlined" style="font-size:1.125rem;">grid_on</span> Export Excel
      </button>
    </div>
  </div>

  <div class="report-top-section">
    <!-- KPI Cards -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1rem;" id="report-kpis">
      <div class="card" style="padding:1rem;">
        <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);">Total Revenue</p>
        <h3 id="r-revenue" style="font-size:1.25rem;font-weight:800;color:var(--text-blue);margin-top:0.25rem;" class="text-rupiah">—</h3>
      </div>
      <div class="card" style="padding:1rem;">
        <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);">Total Orders</p>
        <h3 id="r-orders" style="font-size:1.25rem;font-weight:800;color:var(--text-blue);margin-top:0.25rem;">—</h3>
      </div>
      <div class="card" style="padding:1rem;">
        <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);">Avg. Order Value</p>
        <h3 id="r-avg" style="font-size:1.25rem;font-weight:800;color:var(--text-blue);margin-top:0.25rem;" class="text-rupiah">—</h3>
      </div>
      <div class="card" style="padding:1rem;">
        <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);">Items Sold</p>
        <h3 id="r-items" style="font-size:1.25rem;font-weight:800;color:var(--text-blue);margin-top:0.25rem;">—</h3>
      </div>
    </div>

    <div class="two-col-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
      <!-- Hourly Chart -->
      <div class="card" style="padding:1.25rem; position:relative;">
        <h2 style="font-size:0.875rem;font-weight:700;color:var(--text-blue);margin-bottom:0.25rem;">Revenue by Hour</h2>
        <p style="font-size:0.6875rem;color:var(--on-surface-variant);margin-bottom:1rem;">Grafik sebaran transaksi harian berdasarkan jam</p>
        
        <div class="chart-container-wrapper">
          <!-- Y-Axis labels (populated dynamically by JS) -->
          <div class="chart-y-axis" id="chart-y-axis">
            <span>—</span>
            <span>—</span>
            <span>—</span>
            <span>0</span>
          </div>
          
          <div class="chart-body">
            <!-- Horizontal dashed gridlines -->
            <div class="chart-gridline" style="top:0%;"></div>
            <div class="chart-gridline" style="top:33%;"></div>
            <div class="chart-gridline" style="top:66%;"></div>
            <div class="chart-gridline" style="top:100%; border-top-style:solid; border-top-color:var(--outline-variant);"></div>
            
            <!-- Bars Container -->
            <div class="chart-bars-container" id="hourly-chart"></div>
          </div>
        </div>
        
        <!-- X-Axis -->
        <div id="hour-labels" style="display:flex;gap:4px;margin-top:0.5rem;margin-left:3.25rem;"></div>

        <!-- Dynamic Insights Cards -->
        <div class="insight-card" id="hourly-insights">
          <!-- Filled dynamically by JS -->
        </div>
      </div>

      <!-- Top Products -->
      <div class="card" style="padding:1.25rem;">
        <h2 style="font-size:0.875rem;font-weight:700;color:var(--text-blue);margin-bottom:1rem;">Top Products</h2>
        <div id="top-products" style="display:flex;flex-direction:column;gap:0.75rem;"></div>
      </div>
    </div>
  </div>

  <!-- Transactions Table -->
  <div class="card report-table-card">
    <div style="padding:1rem 1.5rem;border-bottom:1px solid rgba(196,198,207,0.1);display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font-size:0.875rem;font-weight:700;color:var(--text-blue);">Transactions</h2>
      <p id="report-pag-info" style="font-size:0.75rem;color:var(--on-surface-variant);font-weight:600;"></p>
    </div>
    <div style="flex:1;overflow-y:auto;" class="custom-scroll">
      <table class="data-table" style="border-top:none;">
        <thead style="position:sticky;top:0;z-index:10;background:var(--surface-container-lowest);">
          <tr>
            <th>TXN #</th>
            <th>Time</th>
            <th>Customer</th>
            <th style="text-align:center;">Items</th>
            <th style="text-align:right;">Total</th>
            <th>Method</th>
            <th style="text-align:center;">Status</th>
          </tr>
        </thead>
        <tbody id="report-txn-tbody"></tbody>
      </table>
    </div>
    <div class="pagination" id="report-pagination" style="display:none;padding:0.75rem 1.5rem;border-top:1px solid rgba(196,198,207,0.1);background:var(--surface-container-lowest);justify-content:flex-end;">
      <div class="pagination-controls" id="report-pag-ctrl"></div>
    </div>
  </div>
</div>

<script type="module" src="/js/pages/sales-report.js"></script>
