# =====================================================================
# SonarQube Project Configuration
# System Under Test (SUT): GadgetStock
# Kakas Bantu: SonarQube (Static Application Security Testing)
# =====================================================================

# Project Identification
sonar.projectKey=GadgetStock
sonar.projectName=GadgetStock - POS & Inventory Management System
sonar.projectVersion=1.0.0

# Source & Test Paths
sonar.sources=api,public,server.js
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=node_modules/**,stitch_screens/**,public/css/**

# Encoding & Language
sonar.sourceEncoding=UTF-8
sonar.language=js
sonar.javascript.environments=browser,nodejs

# Test Execution & Coverage Reports
sonar.testExecutionReportPaths=reports/sonar-test-report.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate Security Rules
# Focus: OWASP Top 10, CWE-79 (XSS), CWE-285 (Access Control), CWE-259 (Credentials)
sonar.security.hotspots.autoReview=true
